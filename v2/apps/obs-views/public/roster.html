<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS Roster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-view-type="roster">
    <div class="overlay overlay-board">
      <section class="stats-board">
        <header class="stats-board-header">
          <div class="stats-team stats-team--home team-home-accent">
            <img class="team-logo" id="roster-home-logo" alt="" hidden />
            <span class="stats-team-name" id="roster-home-name">HOME</span>
          </div>
          <div class="stats-board-title">
            <span class="stats-board-eyebrow">Match</span>
            <h1>Rosters</h1>
          </div>
          <div class="stats-team stats-team--away team-away-accent">
            <span class="stats-team-name" id="roster-away-name">AWAY</span>
            <img class="team-logo" id="roster-away-logo" alt="" hidden />
          </div>
        </header>
        <div class="board-columns">
          <div class="board-col team-home-accent">
            <div class="board-list roster-list" id="home-roster-list"></div>
          </div>
          <div class="board-col team-away-accent">
            <div class="board-list roster-list" id="away-roster-list"></div>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
