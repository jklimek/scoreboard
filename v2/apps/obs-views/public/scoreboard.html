<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS Scoreboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-view-type="scoreboard">
    <div class="overlay overlay-scoreboard">
      <section class="scoreboard-shell">
        <article class="team-card team-home-accent" id="home-team-card">
          <div class="score-wrap" id="home-score-wrap">
            <div class="score" id="home-score">0</div>
            <div class="timeout-dots" id="home-timeouts" aria-label="Home timeouts left"></div>
          </div>
          <div class="name-row">
            <div class="name" id="home-name">HOME</div>
          </div>
        </article>
        <article class="timer-card card">
          <div class="timer-value" id="game-clock">00:00</div>
        </article>
        <article class="team-card team-away-accent" id="away-team-card">
          <div class="score-wrap" id="away-score-wrap">
            <div class="score" id="away-score">0</div>
            <div class="timeout-dots" id="away-timeouts" aria-label="Away timeouts left"></div>
          </div>
          <div class="name-row">
            <div class="name" id="away-name">AWAY</div>
          </div>
        </article>
      </section>
      <section class="event-stack">
        <article id="scorer-rail" class="event-banner scorer-rail">
          <div class="event-title" id="event-title">GOAL</div>
          <div class="event-primary" id="scorer-text">SCORER</div>
        </article>
        <article id="assist-rail" class="event-banner assist-rail">
          <div class="event-secondary" id="assist-text">ASSIST</div>
        </article>
        <article id="info-rail" class="event-banner info-rail">
          <div class="event-title" id="info-title">INFO</div>
          <div class="event-primary" id="info-primary">UPDATE</div>
          <div class="event-secondary" id="info-secondary"></div>
        </article>
        <article id="player-rail" class="event-banner player-rail">
          <div class="event-title" id="player-title">PLAYER SPOTLIGHT</div>
          <div class="event-primary" id="player-name">PLAYER NAME</div>
          <div class="event-stats" id="player-stats">PTS 0 · G 0 · A 0</div>
          <div class="event-secondary" id="player-note"></div>
        </article>
      </section>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
