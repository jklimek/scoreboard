<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>SCOREBOARD</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="css/scoreboard.css">
    <link rel="stylesheet" href="css/jerseys.css">
</head>
<body>
<!--[if lte IE 9]>
<p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="https://browsehappy.com/">upgrade
    your browser</a> to improve your experience and security.</p>
<![endif]-->
<div class="content">
    <div class="board">
        <div id="th" class="board__box team-home">HOM</div>
        <div class="board__box score-home"><span id="th-score">0</span></div>
        <div class="board__box score-away"><span id="ta-score">0</span></div>
        <div id="ta" class="board__box team-away">AWA</div>

        <div id="timer" class="board__box time"><span id="timer-minutes">00</span>:<span id="timer-seconds">00</span></div>
    </div>
    <!--<div class="logo">-->
        <!--<img src="img/logo_small_opque_web.png" alt="">-->
    <!--</div>-->
    <div class="names">
        <div class="assist-wrapper">
            <div id="assist" class="names__box">-</div>
        </div>

        <div class="scorer-wrapper">
            <div id="scorer" class="names__box">-</div>
        </div>
    </div>
</div>


<script src="js/jquery.js"></script>
<script src="js/easytimer.min.js"></script>
<script src="js/scoreboard.js"></script>
</body>
</html>
