<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>QMPX 2018 SCOREBOARD</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="icon.png">
    <!-- Place favicon.ico in the root directory -->

    <!-- <link rel="stylesheet" href="css/normalize.css"> -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/jerseys.css">
</head>
<body>
<!--[if lte IE 9]>
<p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="https://browsehappy.com/">upgrade
    your browser</a> to improve your experience and security.</p>
<![endif]-->
<div class="content">
    <div class="board">
        <div id="th" class="board__box team-home">HOM</div>
        <div class="board__box score"><span id="th-score">0</span> - <span id="ta-score">0</span></div>
        <div id="ta" class="board__box team-away">AWA</div>
        <div id="timer" class="board__box time"></div>
    </div>

    <div class="names">
        <div class="assist-wrapper">
            <div id="assist" class="names__box">-</div>
        </div>

        <div class="scorer-wrapper">
            <div id="scorer" class="names__box">-</div>
        </div>
    </div>
</div>


<script src="https://code.jquery.com/jquery-3.2.1.min.js"
        integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4=" crossorigin="anonymous">
</script>

<script src="js/main.js"></script>
</body>
</html>
