<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Graph Stats - Scoreboard</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static',filename='images/favicon.ico') }}">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="https://kit.fontawesome.com/e939364dd5.js" crossorigin="anonymous"></script>
    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="../static/css/scoreboard.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<!--[if lte IE 9]>
<p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="https://browsehappy.com/">upgrade
    your browser</a> to improve your experience and security.</p>
<![endif]-->
<div class="content">
    <div id="graph-stats" class="graph-stats active">
        <div id="graph-stats__header">
            <div id="graph-stats__th-name" class="graph-stats__name graph-stats__th-name"></div>
            <div id="graph-stats__ta-name" class="graph-stats__name graph-stats__ta-name"></div>
            <div id="graph-stats__scores" class="graph-stats__scores">
                <span id="graph-stats__th-score"></span> - <span id="graph-stats__ta-score"></span>
            </div>
        </div>

        <div id="graph-stats__time-series" class="graph-stats__chart-container">
            <h3>Scoring Timeline</h3>
            <canvas id="timeSeriesChart"></canvas>
        </div>

        <div id="graph-stats__info">
            Książenice, Boisko 1
        </div>
    </div>
</div>

<script src="../static/js/jquery.js"></script>
<script src="../static/js/easytimer.min.js"></script>
<script src="../static/js/scoreboard.js"></script>
<script src="../static/js/graph_stats.js"></script>
<script>
    // Initialize graph stats view
    $(document).ready(function() {
        if (window.websocket.readyState !== WebSocket.OPEN) {
            websocketConnection();
        }
    });
</script>
</body>
</html>
