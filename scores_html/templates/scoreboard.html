<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Live Event Scoreboard</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static',filename='images/favicon.ico') }}">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="https://kit.fontawesome.com/e939364dd5.js" crossorigin="anonymous"></script>
    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="../static/css/scoreboard.css">
</head>
<body>
<!--[if lte IE 9]>
<p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="https://browsehappy.com/">upgrade
    your browser</a> to improve your experience and security.</p>
<![endif]-->
<div class="content">
    <div class="board">
        <div id="th" class="board__box team-home">HOM</div>
        <div class="board__box score-home" id="th-score-box"><span id="th-score">0</span></div>
        <div class="board__box score-away" id="ta-score-box"><span id="ta-score">0</span></div>
        <div id="ta" class="board__box team-away">AWA</div>

        <div id="timer" class="board__box time">
            <span id="timer-minutes">00</span>:<span id="timer-seconds">00</span>
        </div>
    </div>
    <div class="names">
        <div class="assist-wrapper">
            <div id="assist" class="names__box">-</div>
        </div>

        <div class="scorer-wrapper">
            <div id="scorer" class="names__box">-</div>
        </div>
    </div>

</div>


<script src="../static/js/jquery.js"></script>
<script src="../static/js/easytimer.min.js"></script>
<script src="../static/js/scoreboard.js"></script>
</body>
</html>
