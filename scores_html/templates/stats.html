<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Stream Scoreboard</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static',filename='images/favicon.ico') }}">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="https://kit.fontawesome.com/e939364dd5.js" crossorigin="anonymous"></script>
    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="../static/css/scoreboard.css">
</head>
<body>
<!--[if lte IE 9]>
<p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="https://browsehappy.com/">upgrade
    your browser</a> to improve your experience and security.</p>
<![endif]-->
<div class="content">

    <div id="stats" class="stats active">
        <div id="stats__th-name" class="stats__name stats__th-name">
        </div>
        <div id="stats__div"></div>
        <div id="stats__ta-name" class="stats__name stats__ta-name">
        </div>
        <div id="stats__th-stats" class="stats__stats-th-container">
        </div>
        <div id="stats__stats" class="stats__stats">
            <ul>
                <li>PUNKTY</li>
                <li>PUNKTY W ATAKU</li>
                <li>PUNKTY W OBRONIE</li>
                <li>CZAS W ATAKU</li>
                <li>STRATY</li>
                <li>TIMEOUTY</li>
                <li>TIMELINE</li>
            </ul>
        </div>
        <div id="stats__ta-stats" class="stats__stats-ta-container">
        </div>
        <div id="stats__info">
            Książenice, Boisko 1
        </div>
        <div id="stats__timeline" class="stats__timeline">
            <div class="stats__timeline-container">
                <!-- Timeline will be generated by JavaScript -->
            </div>
        </div>
    </div>
</div>


<script src="../static/js/jquery.js"></script>
<script src="../static/js/easytimer.min.js"></script>
<script src="../static/js/scoreboard.js"></script>
</body>
</html>
