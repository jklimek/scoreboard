<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Stream Controller</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static',filename='images/favicon.ico') }}">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css"
          integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous">

    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="{{ url_for('static',filename='css/controller.css') }}">
</head>

<!--<div id="output"></div>-->
<div class="container-fluid">
    <div class="row">

        <div class="col-8">
            <h2>Game</h2>
            <div class="row">
                <div class="col">
                    <form>
                        <div class="form-group">
                            <label for="gameNumber">Game number</label>
                            <input type="text" class="form-control" pattern="[1-9][0-9]{3}" id="gameNumber" placeholder="Enter game number...">
                            <button type="button" onClick="setGame();" class="btn btn-success btn-block">Set the game
                            </button>
                        </div>

                    </form>
                </div>
            </div>


            <div class="row">
                <div class="col-6">
                    <h3>Team HOME</h3>
                    <h3 id="teamHomeName">-</h3>
                    <form>
                        <div class="form-group">
                            <label for="jerseyInputA">Jerseys color</label>
                            <input id="jerseyInputA" class="jscolor form-control"
                                   onchange="jerseysColor(this.jscolor, 'A')" value="FFFFFF">
                        </div>
                    </form>

                </div>
                <div class="col-6">
                    <h3>Team AWAY</h3>
                    <h3 id="teamAwayName">-</h3>
                    <form>
                        <div class="form-group">
                            <label for="jerseyInputB">Jerseys color</label>
                            <input id="jerseyInputB" class="jscolor form-control"
                                   onchange="jerseysColor(this.jscolor, 'B')" value="FFFFFF">
                        </div>
                    </form>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <h2>Graphics controls</h2>
                    <div id="graphicsControls">
                        <div class="btn-ctrl-group">
<!--                            <div class="btn-group" role="group">-->
<!--                                <button type="button" class="btn" onClick="resetTimer();">Show score</button>-->
<!--                                <button type="button" class="btn btn-secondary" onClick="resetTimer();">Hide score</button>-->
<!--                            </div>-->
                            <div class="btn-group" role="group">
                                <button type="button" class="btn-primary" onClick="toggleWind(1);">Show wind</button>
                                <button type="button" class="btn btn-secondary" onClick="toggleWind(0);">Hide wind</button>
                            </div>

                        </div>
                        <div class="btn-ctrl-group">
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-primary" onClick="toggleRoster(1);toggleStats(0);">Show rosters</button>
                                <button type="button" class="btn btn-secondary" onClick="toggleRoster(0);">Hide rosters</button>
                            </div>
                        </div>
                        <div class="btn-ctrl-group">
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-primary" onClick="toggleStats(1);toggleRoster(0);">Show match stats</button>
                                <button type="button" class="btn btn-secondary" onClick="toggleStats(0);">Hide match stats</button>
                            </div>
                        </div>
<!--                        <div class="btn-ctrl-group">-->
<!--                            <div class="btn-group" role="group">-->
<!--                                <button type="button" class="btn btn-primary">Show leaderboard</button>-->
<!--                                <button type="button" class="btn btn-secondary">Hide leaderboard</button>-->
<!--                            </div>-->
<!--                        </div>-->
                        <button class="btn btn-danger" onClick="resetTimer();">Reset timer</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-4">
            <h2>Websockets</h2>
            <form name="myform">
                <div class="form-group">
                    <!--<label for="wsLogTextarea">Websocket log:</label>-->
                    <textarea class="form-control" id="wsLogTextarea" name="wslog" rows="20"></textarea>
                </div>
                <div class="form-group">
                    <label for="wsUrl">Websocket url</label>
                    <input type="url" name="url" class="form-control" id="wsUrl" value="ws://klimek.jakub.tech:5005/">
                </div>
                <div class="form-group">
                    <button type="button" name=clearButton value="Clear" onClick="clearText();"
                            class="btn btn-secondary btn-sm">Clear
                    </button>
                    <button type="button" name=disconnectButton value="Disconnect" onClick="doDisconnect();"
                            class="btn btn-danger btn-sm">Disconnect
                    </button>
                    <button type="button" name=connectButton value="Connect" onClick="doConnect();"
                            class="btn btn-success btn-sm">Connect
                    </button>
                </div>


            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"
        integrity="sha384-smHYKdLADwkXOn1EmN1qk/HfnUcbVRZyYmZ4qpPea6sjB/pTJ0euyQp0Mk8ck+5T"
        crossorigin="anonymous"></script>

<script src="../static/js/jscolor.js"></script>
<script src="{{ url_for('static',filename='js/jscolor.js') }}"></script>
<script src="{{ url_for('static',filename='js/controller.js') }}"></script>
</html>
